<div class="district-filter">
    <button class="district-toggle" onclick="this.parentElement.classList.toggle('open')" title="地區篩選">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>
        地區篩選
    </button>
    <div class="district-chips">
        <a href="?" class="district-chip {{ 'active' if not selected_district else '' }}">全部</a>
        {% set districts = ['中西區','灣仔','東區','南區','油尖旺','深水埗','九龍城','黃大仙','觀塘','荃灣','屯門','元朗','北區','大埔','沙田','西貢','葵青','離島'] %}
        {% for d in districts %}
        <a href="?district={{ d }}" class="district-chip {{ 'active' if selected_district == d else '' }}">{{ d }}</a>
        {% endfor %}
    </div>
</div>
