{% set p = platform_config.get(video['platform'], {}) %}
<div class="card-platform-badge platform-badge-{{ 'yt' if video['platform'] == 'youtube' else 'ig' if video['platform'] == 'instagram' else 'tt' if video['platform'] == 'tiktok' else 'th' }}">
    {{ p.get('name', video['platform'] | capitalize) }}
</div>
