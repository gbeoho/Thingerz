{% extends "admin/layout.html" %}
{% block admin_content %}
<h1>編輯類別: {{ category['name_zh'] }}</h1>
<form method="POST" style="max-width:600px;background:#11111d;padding:24px;border-radius:14px;border:1px solid rgba(255,255,255,.06)">
    <div class="form-group mb"><label>Slug</label><input name="name_slug" class="input" value="{{ category['name_slug'] }}"></div>
    <div class="form-group mb"><label>中文名稱</label><input name="name_zh" class="input" value="{{ category['name_zh'] }}"></div>
    <div class="form-group mb"><label>英文名稱</label><input name="name_en" class="input" value="{{ category['name_en'] }}"></div>
    <div class="form-group mb"><label>Track</label><select name="track" class="input"><option value="fun" {% if category.get('track')=='fun' %}selected{% endif %}>Fun</option><option value="learning" {% if category.get('track')=='learning' %}selected{% endif %}>Learning</option></select></div>
    <div class="form-group mb"><label>Direction</label><select name="direction" class="input"><option value="fun" {% if category.get('direction')=='fun' %}selected{% endif %}>Fun</option><option value="learning" {% if category.get('direction')=='learning' %}selected{% endif %}>Learning</option><option value="business" {% if category.get('direction')=='business' %}selected{% endif %}>商業配對</option><option value="skills_exchange" {% if category.get('direction')=='skills_exchange' %}selected{% endif %}>技能互換</option></select></div>
    <div class="form-group mb"><label>中文描述</label><input name="description_zh" class="input" value="{{ category.get('description_zh','') }}"></div>
    <div class="form-group mb"><label>英文描述</label><input name="description_en" class="input" value="{{ category.get('description_en','') }}"></div>
    <button type="submit" class="btn btn-primary">儲存</button>
    <a href="{{ url_for('admin_categories') }}" class="btn" style="background:transparent;border:1px solid rgba(255,255,255,.1);color:#e4e4ed">取消</a>
</form>
{% endblock %}
