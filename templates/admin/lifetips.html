{% extends "admin/layout.html" %}
{% block admin_content %}
<h1>生活小知識管理</h1>
<div class="mb" style="display:flex;gap:12px;flex-wrap:wrap">
    <a href="#" onclick="resetForm();return false" class="btn btn-primary">+ 新增小知識</a>
</div>
<div id="addForm" style="display:none;background:#11111d;padding:20px;border-radius:14px;border:1px solid rgba(255,255,255,.06);margin-bottom:24px">
    <h3 id="formTitle" style="margin-bottom:14px">新增小知識</h3>
    <form method="POST" id="editForm" action="{{ url_for('admin_lifetips') }}">
        <input type="hidden" name="tip_id" id="tipId" value="">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
            <div class="form-group"><label>中文標題</label><input name="title_zh" class="input" required></div>
            <div class="form-group"><label>英文標題</label><input name="title_en" class="input"></div>
            <div class="form-group"><label>日期</label><input name="date" class="input" type="date" value="{{ now.strftime('%Y-%m-%d') }}"></div>
            <div class="form-group"><label>封面 / 圖片 URL（可貼 YouTube URL）</label><input name="image_url" class="input" placeholder="https://..."></div>
            <div class="form-group"><label>狀態</label><select name="status" class="input"><option value="published">已發佈</option><option value="draft">草稿</option></select></div>
            <div class="form-group"><label>地區</label><select name="region" class="input"><option value="hk">香港</option><option value="foreign">海外（不會顯示）</option></select></div>
        </div>
        <div class="form-group mb"><label>中文摘要</label><input name="summary_zh" class="input"></div>
        <div class="form-group mb"><label>英文摘要</label><input name="summary_en" class="input"></div>
        <div class="form-group mb"><label>中文內容（HTML；貼 YouTube link 會自動嵌入播放）</label><textarea name="content_zh" class="input" style="min-height:120px"></textarea></div>
        <div class="form-group mb"><label>英文內容 (HTML)</label><textarea name="content_en" class="input" style="min-height:120px"></textarea></div>
        <div style="display:flex;gap:8px">
            <button type="submit" class="btn btn-success" id="saveBtn">新增小知識</button>
            <button type="button" class="btn" onclick="resetForm()">取消</button>
        </div>
    </form>
</div>
<table>
    <thead><tr><th>ID</th><th>標題</th><th>日期</th><th>狀態</th><th>地區</th><th>操作</th></tr></thead>
    <tbody>
    {% for t in tip_items %}
    <tr>
        <td>{{ t['id'] }}</td>
        <td><strong>{{ t['title_zh'] }}</strong></td>
        <td>{{ t.get('date','') }}</td>
        <td><span class="badge badge-{{ t.get('status','published') }}">{{ t.get('status','published') }}</span></td>
        <td>{{ t.get('region','hk') }}</td>
        <td>
            <button class="btn btn-primary btn-sm"
               data-id="{{ t['id'] }}"
               data-title-zh="{{ t.get('title_zh','') }}"
               data-title-en="{{ t.get('title_en','') }}"
               data-date="{{ t.get('date','') }}"
               data-image="{{ t.get('image_url','') }}"
               data-status="{{ t.get('status','published') }}"
               data-summary-zh="{{ t.get('summary_zh','') }}"
               data-summary-en="{{ t.get('summary_en','') }}"
               data-content-zh="{{ t.get('content_zh','') }}"
               data-content-en="{{ t.get('content_en','') }}"
               data-region="{{ t.get('region','hk') }}"
               onclick="editTipFill(this)">編輯</button>
            <form method="POST" action="{{ url_for('admin_lifetips_delete', tip_id=t['id']) }}" style="display:inline" onsubmit="return confirm('確定刪除？')"><button class="btn btn-danger btn-sm">刪除</button></form>
        </td>
    </tr>
    {% endfor %}
    </tbody>
</table>
<script>
function resetForm(){
    var panel=document.getElementById('addForm');panel.style.display='block';
    document.getElementById('formTitle').textContent='新增小知識';
    document.getElementById('saveBtn').textContent='新增小知識';
    var f=document.getElementById('editForm');f.action="{{ url_for('admin_lifetips') }}";
    document.getElementById('tipId').value='';
    f.title_zh.value='';f.title_en.value='';f.image_url.value='';f.summary_zh.value='';f.summary_en.value='';f.content_zh.value='';f.content_en.value='';
    f.status.value='published';f.region.value='hk';
    f.date.value="{{ now.strftime('%Y-%m-%d') }}";
    panel.scrollIntoView({behavior:'smooth',block:'start'});
}
function editTipFill(btn){
    var panel=document.getElementById('addForm');panel.style.display='block';
    document.getElementById('formTitle').textContent='編輯小知識 — '+btn.getAttribute('data-id');
    document.getElementById('saveBtn').textContent='↓ 儲存編輯';
    var f=document.getElementById('editForm');
    f.action='/admin/lifetips/edit/'+btn.getAttribute('data-id');
    document.getElementById('tipId').value=btn.getAttribute('data-id');
    f.title_zh.value=btn.getAttribute('data-title-zh');
    f.title_en.value=btn.getAttribute('data-title-en');
    f.date.value=btn.getAttribute('data-date');
    f.image_url.value=btn.getAttribute('data-image');
    f.status.value=btn.getAttribute('data-status');
    f.summary_zh.value=btn.getAttribute('data-summary-zh');
    f.summary_en.value=btn.getAttribute('data-summary-en');
    f.content_zh.value=btn.getAttribute('data-content-zh');
    f.content_en.value=btn.getAttribute('data-content-en');
    f.region.value=btn.getAttribute('data-region');
    panel.scrollIntoView({behavior:'smooth',block:'start'});
}
</script>
{% endblock %}
