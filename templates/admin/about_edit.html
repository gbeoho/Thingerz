{% extends "admin/layout.html" %}
{% block admin_content %}
<h1>編輯平台簡介</h1>
<form method="POST" style="background:#11111d;border-radius:14px;padding:24px;border:1px solid rgba(255,255,255,.04)">
    <div class="form-group mb">
        <label style="display:block;color:#9898b0;margin-bottom:8px">內容（支援 HTML）</label>
        <textarea name="content" class="input textarea" rows="20" style="min-height:300px;font-size:.9rem;line-height:1.6">{{ content }}</textarea>
    </div>
    <button class="btn btn-primary">儲存</button>
    <a href="{{ url_for('about') }}" target="_blank" class="btn btn-outline">預覽</a>
</form>
{% endblock %}
