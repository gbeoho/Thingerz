{% extends "base.html" %}
{% block title %}本月好去處 - Thingerz{% endblock %}

{% block content %}
<section class="page-hero">
    <div class="container">
        <h1>本月好去處</h1>
        <p class="page-subtitle">香港每月最新景點、活動及美食推介</p>
    </div>
</section>

<section class="section">
    <div class="container">
        <div class="news-grid-full">
            {% for item in news_items %}
            <article class="news-card-full">
                <div class="news-image">
                    <img src="{{ item['image_url'] }}" alt="{{ item['title_zh'] }}" loading="lazy">
                </div>
                <div class="news-info">
                    <time class="news-date">{{ item['date'] }}</time>
                    <h2><a href="{{ url_for('news_detail', news_id=item['id']) }}">{{ item['title_zh'] }}</a></h2>
                    <p>{{ item['summary_zh'] }}</p>
                    <a href="{{ url_for('news_detail', news_id=item['id']) }}" class="read-more">閱讀全文 &rarr;</a>
                </div>
            </article>
            {% endfor %}
            {% if not news_items %}
            <div class="empty-state">
                <p>暫無好去處推介</p>
            </div>
            {% endif %}
        </div>
    </div>
</section>
{% endblock %}
