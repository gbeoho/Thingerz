<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thingerz Crawler Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI','Microsoft JhengHei',sans-serif;background:#0a0a0f;color:#e4e4ed;min-height:100vh}
header{background:#11111d;border-bottom:1px solid rgba(255,255,255,.05);padding:16px 24px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:1.2rem;font-weight:700}
header span{font-size:.75rem;color:#6a6a80}
.container{max-width:1400px;margin:0 auto;padding:24px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.kpi{background:#11111d;border-radius:14px;padding:20px;border:1px solid rgba(255,255,255,.04)}
.kpi h3{font-size:.72rem;color:#6a6a80;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.kpi .val{font-size:2rem;font-weight:800;background:linear-gradient(135deg,#818cf8,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
.chart-box{background:#11111d;border-radius:14px;padding:20px;border:1px solid rgba(255,255,255,.04)}
.chart-box h3{font-size:.8rem;color:#9898b0;margin-bottom:16px}
canvas{max-height:300px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.filters select,.filters input{background:#11111d;border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:8px 14px;font-size:.8rem;color:#e4e4ed;outline:none}
.filters input{width:200px}
table{width:100%;border-collapse:collapse;background:#11111d;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.04)}
th{text-align:left;padding:10px 14px;font-size:.72rem;color:#6a6a80;text-transform:uppercase;background:#0a0a0f;border-bottom:1px solid rgba(255,255,255,.04)}
td{padding:10px 14px;font-size:.8rem;border-bottom:1px solid rgba(255,255,255,.02)}
tr:hover td{background:rgba(99,102,241,.04)}
td img{width:80px;height:45px;object-fit:cover;border-radius:6px}
td a{color:#818cf8;text-decoration:none}
.pagination{display:flex;gap:8px;justify-content:center;margin-top:16px}
.pagination button{background:#11111d;border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:8px 16px;font-size:.8rem;color:#9898b0;cursor:pointer}
.pagination button:hover{background:#1a1a2e;color:#fff}
.loading{text-align:center;color:#6a6a80;padding:40px}
@media(max-width:768px){.charts{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
    <h1>Thingerz Crawler</h1>
    <span id="updated"></span>
</header>
<div class="container">
    <div class="kpi-grid" id="kpi"></div>
    <div class="charts">
        <div class="chart-box"><h3>平台分佈</h3><canvas id="platformChart"></canvas></div>
        <div class="chart-box"><h3>地區分佈</h3><canvas id="districtChart"></canvas></div>
    </div>
    <div class="chart-box" style="margin-bottom:24px"><h3>子類別分佈</h3><canvas id="catChart" style="max-height:400px"></canvas></div>
    <div style="margin-bottom:24px">
        <h3 style="font-size:.8rem;color:#9898b0;margin-bottom:12px">最新內容</h3>
        <div class="filters">
            <select id="fPlatform" onchange="loadItems()"><option value="">全部平台</option></select>
            <select id="fDistrict" onchange="loadItems()"><option value="">全部地區</option></select>
            <select id="fCategory" onchange="loadItems()"><option value="">全部子類別</option></select>
            <input id="fSearch" placeholder="搜尋標題..." onkeyup="debounce(loadItems,300)()">
        </div>
        <div id="tableContainer"></div>
    </div>
</div>
<script>
let charts = {};
let offset = 0, limit = 20;
let debounceTimer;
function debounce(fn,ms){return function(){clearTimeout(debounceTimer);debounceTimer=setTimeout(fn,ms)}}

async function loadStats(){
    let r=await fetch('/api/stats'); let d=await r.json();
    document.getElementById('updated').textContent=new Date().toLocaleString('zh-HK');
    document.getElementById('kpi').innerHTML=
        '<div class="kpi"><h3>總內容</h3><div class="val">'+d.total.toLocaleString()+'</div></div>'+
        '<div class="kpi"><h3>平台數</h3><div class="val">'+d.platforms.length+'</div></div>'+
        '<div class="kpi"><h3>子類別覆蓋</h3><div class="val">'+d.sub_categories_covered+'</div></div>'+
        '<div class="kpi"><h3>地區覆蓋</h3><div class="val">'+d.districts_covered+'</div></div>';
    
    let platforms=d.platforms, districts=[];
    let dr=await fetch('/api/districts'); districts=await dr.json();
    
    if(charts.platform) charts.platform.destroy();
    charts.platform=new Chart(document.getElementById('platformChart'),{type:'bar',data:{labels:platforms.map(p=>p.platform),datasets:[{label:'內容數',data:platforms.map(p=>p.count),backgroundColor:['#6366f1','#ec4899','#06b6d4','#f59e0b','#10b981','#ef4444']}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{ticks:{color:'#9898b0'},grid:{color:'rgba(255,255,255,.04)'}},x:{ticks:{color:'#9898b0'},grid:{display:false}}}}});

    if(charts.district) charts.district.destroy();
    charts.district=new Chart(document.getElementById('districtChart'),{type:'bar',indexAxis:'y',data:{labels:districts.slice(0,10).map(d=>d.district),datasets:[{label:'內容數',data:districts.slice(0,10).map(d=>d.count),backgroundColor:'#06b6d4'}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#9898b0'},grid:{color:'rgba(255,255,255,.04)'}},y:{ticks:{color:'#9898b0'},grid:{display:false}}}}});

    let cr=await fetch('/api/categories'); let cats=await cr.json();
    if(charts.cat) charts.cat.destroy();
    charts.cat=new Chart(document.getElementById('catChart'),{type:'bar',data:{labels:cats.map(c=>c.name_zh),datasets:[{label:'內容數',data:cats.map(c=>c.count),backgroundColor:cats.map(c=>['商業','教學'].some(g=>c.group.includes(g))?'#6366f1':'#06b6d4')}]},options:{indexAxis:'y',responsive:true,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#9898b0'},grid:{color:'rgba(255,255,255,.04)'}},y:{ticks:{color:'#9898b0',font:{size:10}},grid:{display:false}}}}});
    
    let fP=document.getElementById('fPlatform');
    let fD=document.getElementById('fDistrict');
    let fC=document.getElementById('fCategory');
    fP.innerHTML='<option value="">全部平台</option>'+platforms.map(p=>'<option value="'+p.platform+'">'+p.platform+' ('+p.count+')</option>').join('');
    fD.innerHTML='<option value="">全部地區</option>'+districts.map(d=>'<option value="'+d.district+'">'+d.district+' ('+d.count+')</option>').join('');
    fC.innerHTML='<option value="">全部子類別</option>'+cats.map(c=>'<option value="'+c.id+'">'+c.name_zh+' ('+c.count+')</option>').join('');
}

async function loadItems(){
    let p=document.getElementById('fPlatform').value;
    let d=document.getElementById('fDistrict').value;
    let c=document.getElementById('fCategory').value;
    let q=document.getElementById('fSearch').value;
    let r=await fetch('/api/items?platform='+p+'&district='+d+'&category='+c+'&q='+encodeURIComponent(q)+'&limit='+limit+'&offset='+offset);
    let data=await r.json();
    let html='<table><thead><tr><th>縮圖</th><th>標題</th><th>平台</th><th>地區</th><th>觀看</th><th>評分</th></tr></thead><tbody>';
    data.items.forEach(function(item){
        html+='<tr><td>'+(item.thumbnail_url?'<img src="'+item.thumbnail_url+'" loading="lazy">':'')+'</td><td><a href="'+item.url+'" target="_blank">'+item.title+'</a></td><td>'+item.platform+'</td><td>'+item.district+'</td><td>'+(item.view_count||0).toLocaleString()+'</td><td>'+(item.score||0).toFixed(2)+'</td></tr>';
    });
    html+='</tbody></table>';
    html+='<div class="pagination">';
    if(offset>0) html+='<button onclick="offset-='+limit+';loadItems()">上一頁</button>';
    if(data.items.length===limit) html+='<button onclick="offset+='+limit+';loadItems()">下一頁</button>';
    html+='</div>';
    document.getElementById('tableContainer').innerHTML=html;
}

loadStats();
loadItems();
</script>
</body>
</html>
